# Runtime Garden /opt/stacks/personal-tracker
# Only the web container joins existing external `proxy`; PostgreSQL remains private.
x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: personal-tracker:${IMAGE_TAG:-1.0.0-rc.2}
  # Images are built from this checkout; Dockge "Update" rebuilds instead of pulling from a registry.
  pull_policy: build
  restart: unless-stopped
  user: node
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 192
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  environment:
    NODE_ENV: production
    APP_URL: ${APP_URL:?Set APP_URL}
    COOKIE_SECURE: 'true'
    DATABASE_URL: postgres://tracker:${DB_PASSWORD:?Set DB_PASSWORD}@personal-tracker-db:5432/tracker
    SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN}
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
    MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-}
    SESSION_DAYS: ${SESSION_DAYS:-7}
    TRUST_PROXY: ${TRUST_PROXY:-}
    TZ: ${TZ:-Europe/Riga}
  networks:
    - private
services:
  personal-tracker-web:
    <<: *common
    depends_on:
      personal-tracker-db:
        condition: service_healthy
      personal-tracker-migrate:
        condition: service_completed_successfully
    networks:
      - private
      - proxy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL}
      COOKIE_SECURE: 'true'
      DATABASE_URL: postgres://tracker:${DB_PASSWORD:?Set DB_PASSWORD}@personal-tracker-db:5432/tracker
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TZ: ${TZ:-Europe/Riga}
      ATTACHMENTS_DIR: /app/uploads
    volumes:
      - personal_tracker_uploads:/app/uploads
    # No host port publication. NPM -> personal-tracker-web:3000 on external `proxy`.
  personal-tracker-worker:
    <<: *common
    command: ["node", "dist/api/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      personal-tracker-db:
        condition: service_healthy
      personal-tracker-migrate:
        condition: service_completed_successfully
    # Worker uses no public ingress; separate outbound network is needed for email delivery.
    networks:
      - private
      - egress
  personal-tracker-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: personal-tracker-migrate:${IMAGE_TAG:-1.0.0-rc.2}
    pull_policy: build
    restart: "no"
    environment:
      DATABASE_URL: postgres://tracker:${DB_PASSWORD:?Set DB_PASSWORD}@personal-tracker-db:5432/tracker
    depends_on:
      personal-tracker-db:
        condition: service_healthy
    networks: [private]
  personal-tracker-db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - personal_tracker_pg:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Intentionally no ports: mapping or external proxy network.
volumes:
  personal_tracker_pg:
  personal_tracker_uploads:
networks:
  proxy:
    # Existing Nginx Proxy Manager network; set PROXY_NETWORK if yours is not called "proxy".
    name: ${PROXY_NETWORK:-proxy}
    external: true
  private:
    internal: true
  egress:
    driver: bridge
